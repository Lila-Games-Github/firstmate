<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crew board</title>
<style>
/* ============================================================
   Crew board - the live per-worker view built by bin/fm-crew-board.sh.
   Tokens are the Firstmate Design System set the bearings board inlines
   (board-template.html beside this file), kept portable the same way.
   ============================================================ */
@import url("https://fonts.googleapis.com/css2?family=Chango&family=Jost:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap");

:root {
  --rust-700: #8f2f17; --rust-600: #a93a1f; --rust-500: #c0452a; --rust-050: #fbece3;
  --navy-700: #1a2238;
  --gold-600: #b5791c; --gold-500: #e0a52e; --gold-300: #f0d38c; --gold-100: #f8ecc9;
  --ocean-600: #2f6688; --ocean-500: #3c7ea6; --ocean-050: #e8f1f5;
  --sea-700: #234e3a; --sea-500: #2f6b4f; --sea-200: #b9d4c5; --sea-050: #e9f2ec;
  --paper-000: #fbf4e2; --paper-100: #f6ecd3; --paper-300: #e7d6ae;
  --cream-line: #ddc89c;
  --ink-900: #241c14; --ink-700: #3f3224; --ink-500: #6f5e46; --ink-300: #9c8a6c;
  --white: #fffdf7;
  --bg-page: var(--paper-100);
  --surface-card: var(--white);
  --surface-card-warm: var(--paper-000);
  --text-strong: var(--ink-900); --text-body: var(--ink-700);
  --text-muted: var(--ink-500); --text-faint: var(--ink-300);
  --border-default: var(--cream-line); --border-soft: var(--paper-300);
  --font-display: "Chango", "Cooper Black", Rockwell, Georgia, serif;
  --font-sans: "Jost", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-h3: 1.4rem; --fs-base: 1rem; --fs-sm: 0.9375rem; --fs-xs: 0.8125rem; --fs-2xs: 0.6875rem;
  --ls-caps: 0.16em;
  --radius-xs: 6px; --radius-sm: 9px; --radius-md: 12px; --radius-banner: 7px; --radius-lg: 18px;
  --shadow-sm: 0 1px 2px rgba(36, 28, 20, 0.06), 0 4px 10px rgba(36, 28, 20, 0.06);
  --shadow-hard-sm: 3px 3px 0 var(--ink-900);
  --focus-ring: 0 0 0 3px var(--gold-300);
  --container-app: 1180px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans); color: var(--text-body); background: var(--bg-page);
  line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

.fm-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-2xs); font-weight: 800; line-height: 1;
  padding: 5px 9px 4px; text-transform: uppercase; letter-spacing: 0.07em;
  border-radius: var(--radius-xs); border: 1.5px solid var(--ink-900);
  box-shadow: 2px 2px 0 var(--ink-900); white-space: nowrap;
}
.fm-badge--online  { background: var(--sea-500);  color: var(--paper-000); }
.fm-badge--warn    { background: var(--gold-500); color: var(--navy-700); }
.fm-badge--danger  { background: var(--rust-600); color: var(--paper-000); }
.fm-badge--info    { background: var(--ocean-500); color: var(--paper-000); }
.fm-badge--neutral { background: var(--paper-000); color: var(--ink-900); }
.fm-badge--solid   { background: var(--rust-500); color: var(--paper-000); }

.fm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-sans); font-weight: 800; line-height: 1; white-space: nowrap;
  border: 2px solid var(--ink-900); border-radius: var(--radius-banner); cursor: pointer;
  font-size: var(--fs-xs); padding: 8px 14px; box-shadow: var(--shadow-hard-sm);
}
.fm-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.fm-btn:active { transform: translateY(1px); }
.fm-btn--primary { background: var(--rust-500); color: var(--white); }
.fm-btn--gold { background: var(--gold-500); color: var(--navy-700); }

.cb-nav {
  position: sticky; top: 0; z-index: 20; background: var(--paper-100);
  border-bottom: 1px solid var(--border-default);
}
.cb-nav__inner {
  max-width: var(--container-app); margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.cb-brand { font-family: var(--font-display); font-size: 22px; color: var(--text-strong); line-height: 1; }
.cb-meta { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint); }
.cb-main {
  max-width: var(--container-app); margin: 0 auto; padding: 18px 16px 96px;
  display: flex; flex-direction: column; gap: 20px;
}
.cb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.cb-stat {
  display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; min-width: 0;
  background: var(--surface-card-warm); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
}
.cb-stat--call { background: var(--rust-050); border: 2px solid var(--rust-500); }
.cb-stat__num { font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: 600; line-height: 1; color: var(--text-strong); }
.cb-stat__label { font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }

.cb-section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cb-sign {
  font-weight: 800; text-transform: uppercase; letter-spacing: var(--ls-caps);
  font-size: var(--fs-xs); color: var(--rust-500);
}
.cb-card {
  background: var(--surface-card); border: 1px solid var(--border-default);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
}
.cb-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px;
  padding: 14px 18px; border-top: 1px solid var(--border-soft); min-width: 0;
}
.cb-row:first-child { border-top: none; }
.cb-row.is-gone { background: var(--surface-card-warm); }
.cb-row.is-gone .cb-row__title { color: var(--text-muted); }
.cb-row.is-pointed { box-shadow: inset 4px 0 0 var(--gold-500); }
.cb-row__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.cb-row__title { font-size: var(--fs-base); font-weight: 700; color: var(--text-strong); line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.cb-row__sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint); overflow-wrap: anywhere; }
.cb-row__note {
  font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.4; margin-top: 4px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.cb-help { margin: 0; font-size: var(--fs-sm); color: var(--text-muted); }
.cb-row__since { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); white-space: nowrap; }
.cb-row__pr { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 600; color: var(--ocean-600); overflow-wrap: anywhere; }
.cb-row__pr:hover { text-decoration: underline; }
.cb-row__flag { font-size: var(--fs-2xs); font-weight: 700; color: var(--rust-600); }
.cb-row__side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.cb-point { display: flex; gap: 8px; align-items: center; grid-column: 1 / -1; flex-wrap: wrap; }
.cb-point__note {
  flex: 1 1 220px; min-width: 0; font-family: var(--font-sans); font-size: var(--fs-sm); color: var(--text-strong);
  background: var(--surface-card); border: 1.5px solid var(--border-default); border-radius: var(--radius-sm); padding: 7px 10px;
}
.cb-point__note:focus { outline: none; border-color: var(--rust-500); box-shadow: var(--focus-ring); }
.cb-point__state { font-size: var(--fs-2xs); font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--sea-700); }
.cb-empty { padding: 18px; font-size: var(--fs-sm); color: var(--text-muted); }
.cb-send {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--paper-100); border-top: 2px solid var(--ink-900);
}
.cb-send__inner {
  max-width: var(--container-app); margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.cb-send__text { font-size: var(--fs-sm); color: var(--text-body); }
.cb-error { padding: 22px; font-size: var(--fs-sm); color: var(--rust-600); }
@media (max-width: 560px) {
  .cb-row { grid-template-columns: minmax(0, 1fr); }
  .cb-row__side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
}
</style>
</head>
<body>
<header class="cb-nav"><div class="cb-nav__inner">
  <span class="cb-brand">Crew board</span>
  <span class="cb-meta" id="cb-provenance"></span>
</div></header>
<main class="cb-main" id="cb-main">
  <div class="cb-stats" id="cb-stats"></div>
  <p class="cb-help">Workers report their own phase; this page updates as they do. To point firstmate at a worker, press its button (a note is optional), then send - or click any row in annotate mode and comment on it.</p>
  <div id="cb-sections"></div>
</main>
<div class="cb-send" id="cb-send" hidden><div class="cb-send__inner">
  <span class="cb-send__text" id="cb-send-text"></span>
  <button type="button" class="fm-btn fm-btn--primary" id="cb-send-button" data-lavish-action>Send to firstmate</button>
</div></div>
<script id="crew-board-data" type="application/json">
__FM_CREW_BOARD_DATA__
</script>
<script>
(function () {
  var main = document.getElementById("cb-main");
  function fatal(msg) {
    main.textContent = "";
    var p = document.createElement("p");
    p.className = "cb-error";
    p.textContent = msg + " - ask firstmate to run the crew board command again.";
    main.appendChild(p);
  }
  var data;
  try {
    data = JSON.parse(document.getElementById("crew-board-data").textContent);
  } catch (e) {
    fatal("The crew board data is not valid JSON");
    return;
  }
  if (!data || data.schema !== "fm-crew-board.v1" || !Array.isArray(data.rows)) {
    fatal("Unsupported crew board data");
    return;
  }

  /* Phase vocabulary owned by bin/fm-classify-lib.sh; the board only labels it.
     An unknown phase still renders, as itself, so a newer worker never vanishes. */
  var PHASES = {
    "needs-decision": { label: "Waiting on a decision", tone: "danger", group: "attention" },
    "blocked":        { label: "Blocked", tone: "danger", group: "attention" },
    "failed":         { label: "Failed", tone: "danger", group: "attention" },
    "ready-to-merge": { label: "Ready to merge", tone: "online", group: "ready" },
    "done":           { label: "Done, waiting on firstmate", tone: "online", group: "ready" },
    "investigating":  { label: "Investigating", tone: "info", group: "working" },
    "building":       { label: "Building", tone: "info", group: "working" },
    "fixing":         { label: "Fixing", tone: "warn", group: "working" },
    "testing":        { label: "Testing", tone: "info", group: "working" },
    "validating":     { label: "Validating", tone: "info", group: "working" },
    "working":        { label: "Working", tone: "neutral", group: "working" },
    "starting":       { label: "Starting", tone: "neutral", group: "working" },
    "paused":         { label: "Paused", tone: "warn", group: "paused" }
  };
  var GROUPS = [
    { key: "attention", title: "Needs attention" },
    { key: "ready", title: "Ready" },
    { key: "working", title: "Working" },
    { key: "paused", title: "Paused" },
    { key: "gone", title: "Finished or left" }
  ];
  function phaseInfo(p) {
    return PHASES[p] || { label: String(p || "unknown"), tone: "neutral", group: "working" };
  }
  function groupOf(row) { return row.gone ? "gone" : phaseInfo(row.phase).group; }

  function nowSecs() { return Math.floor(Date.now() / 1000); }
  function duration(secs) {
    if (!(secs >= 0)) return "";
    if (secs < 60) return "under a minute";
    var m = Math.floor(secs / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d > 0) return d + "d " + (h % 24) + "h";
    if (h > 0) return h + "h " + (m % 60 < 10 ? "0" : "") + (m % 60) + "m";
    return m + "m";
  }
  function sinceText(row) {
    if (row.gone) {
      var left = typeof row.left_at === "number" ? duration(nowSecs() - row.left_at) : "";
      return left ? "left " + left + " ago" : "left";
    }
    var d = typeof row.phase_since === "number" ? duration(nowSecs() - row.phase_since) : "";
    return d ? "for " + d : "";
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function store(key, value) {
    try {
      if (value == null) window.sessionStorage.removeItem(key); else window.sessionStorage.setItem(key, value);
    } catch (e) { /* storage is a convenience; the board works without it */ }
  }
  function recall(key) {
    try { return window.sessionStorage.getItem(key) || ""; } catch (e) { return ""; }
  }

  document.getElementById("cb-provenance").textContent =
    (data.home ? data.home + " · " : "") + "updated " + (data.generated || "");

  var live = data.rows.filter(function (r) { return !r.gone; });
  var stats = [
    { n: live.length, l: "workers" },
    { n: live.filter(function (r) { return groupOf(r) === "attention"; }).length, l: "need attention", call: true },
    { n: live.filter(function (r) { return r.phase === "ready-to-merge"; }).length, l: "ready to merge" },
    { n: live.filter(function (r) { return groupOf(r) === "working"; }).length, l: "working" }
  ];
  var strip = document.getElementById("cb-stats");
  stats.forEach(function (s) {
    var t = el("div", "cb-stat" + (s.call && s.n > 0 ? " cb-stat--call" : ""));
    t.appendChild(el("span", "cb-stat__num", String(s.n)));
    t.appendChild(el("span", "cb-stat__label", s.l));
    strip.appendChild(t);
  });

  /* Pointing: each row queues one Lavish prompt carrying exactly what the row
     shows, keyed per worker so pointing again replaces the earlier one. The
     prompt reaches firstmate as an ordinary durable process-event wake. */
  var pointed = {};
  try { pointed = JSON.parse(recall("cb-pointed") || "{}") || {}; } catch (e) { pointed = {}; }
  function savePointed() {
    store("cb-pointed", Object.keys(pointed).length ? JSON.stringify(pointed) : null);
  }
  function updateSendBar() {
    var n = Object.keys(pointed).length;
    var bar = document.getElementById("cb-send");
    bar.hidden = n === 0;
    document.getElementById("cb-send-text").textContent =
      n === 1 ? "1 worker pointed out" : n + " workers pointed out";
  }
  function rowSummary(row) {
    var parts = [row.id, phaseInfo(row.phase).label];
    var since = sinceText(row);
    if (since) parts.push(since);
    if (row.project) parts.push(row.project);
    parts.push(row.title || row.id);
    if (row.note) parts.push("latest: " + row.note);
    if (row.pr_url) parts.push(row.pr_url);
    if (row.gone) parts.push("no longer running");
    return parts.join(" | ");
  }
  function point(row, rowEl, comment) {
    var summary = rowSummary(row);
    var prompt = "The captain pointed at worker " + row.id + " on the crew board: " + summary +
      (comment ? "\nCaptain's note: " + comment : "");
    if (window.lavish && window.lavish.queuePrompt) {
      window.lavish.queuePrompt(prompt, {
        tag: "crew-point",
        text: summary,
        element: rowEl,
        queueKey: "crew-point:" + row.id,
        data: {
          task: row.id, title: row.title || row.id, project: row.project || "",
          phase: row.phase, phase_label: phaseInfo(row.phase).label, in_phase: sinceText(row),
          note: row.note || "", pr_url: row.pr_url || "", gone: !!row.gone,
          comment: comment || "", board_generated: data.generated || ""
        }
      });
    }
    pointed[row.id] = true;
    savePointed();
    rowEl.classList.add("is-pointed");
    updateSendBar();
  }
  document.getElementById("cb-send-button").addEventListener("click", function () {
    if (window.lavish && window.lavish.sendQueuedPrompts) window.lavish.sendQueuedPrompts();
    Object.keys(pointed).forEach(function (id) { store("cb-note:" + id, null); });
    pointed = {};
    savePointed();
    updateSendBar();
  });

  var sinceNodes = [];
  function renderRow(row) {
    var info = phaseInfo(row.phase);
    var r = el("div", "cb-row" + (row.gone ? " is-gone" : "") + (pointed[row.id] ? " is-pointed" : ""));
    r.setAttribute("id", "cb-row-" + row.id);
    r.setAttribute("data-task", row.id);
    r.setAttribute("data-phase", row.phase);
    var body = el("div", "cb-row__body");
    var head = el("div", "cb-row__head");
    head.appendChild(el("span", "fm-badge fm-badge--" + (row.gone ? "neutral" : info.tone),
      row.gone ? "Left · was " + info.label : info.label));
    head.appendChild(el("span", "cb-row__title", row.title || row.id));
    body.appendChild(head);
    body.appendChild(el("div", "cb-row__sub", [row.id, row.project, row.kind].filter(Boolean).join(" · ")));
    if (row.note) {
      var noteEl = el("div", "cb-row__note", row.note);
      noteEl.setAttribute("title", row.note);
      body.appendChild(noteEl);
    }
    if (row.endpoint === "absent" && !row.gone) {
      body.appendChild(el("div", "cb-row__flag", "Its window is gone - firstmate is checking on it"));
    }
    r.appendChild(body);
    var side = el("div", "cb-row__side");
    var since = el("span", "cb-row__since", sinceText(row));
    sinceNodes.push({ node: since, row: row });
    side.appendChild(since);
    if (row.pr_url) {
      var a = el("a", "cb-row__pr", row.pr_url.replace(/^https:\/\/github\.com\//, ""));
      a.setAttribute("href", row.pr_url);
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
      side.appendChild(a);
    }
    r.appendChild(side);
    var pointRow = el("div", "cb-point");
    var note = el("input", "cb-point__note");
    note.setAttribute("type", "text");
    note.setAttribute("placeholder", "Optional note for firstmate");
    note.setAttribute("aria-label", "Note about " + row.id);
    note.value = recall("cb-note:" + row.id);
    note.addEventListener("input", function () { store("cb-note:" + row.id, note.value); });
    var btn = el("button", "fm-btn fm-btn--gold cb-point__button", "Point firstmate here");
    btn.setAttribute("type", "button");
    btn.setAttribute("data-lavish-action", "");
    btn.addEventListener("click", function () { point(row, r, note.value.trim()); });
    pointRow.appendChild(note);
    pointRow.appendChild(btn);
    r.appendChild(pointRow);
    return r;
  }

  var sections = document.getElementById("cb-sections");
  GROUPS.forEach(function (g) {
    var rows = data.rows.filter(function (r) { return groupOf(r) === g.key; });
    if (!rows.length) return;
    if (g.key === "gone") {
      rows.sort(function (a, b) { return (b.left_at || 0) - (a.left_at || 0); });
    } else {
      rows.sort(function (a, b) { return (a.phase_since || 0) - (b.phase_since || 0); });
    }
    var sec = el("section", "cb-section");
    sec.setAttribute("data-group", g.key);
    sec.appendChild(el("h2", "cb-sign", g.title + " (" + rows.length + ")"));
    var card = el("div", "cb-card");
    rows.forEach(function (row) { card.appendChild(renderRow(row)); });
    sec.appendChild(card);
    sections.appendChild(sec);
  });
  if (!data.rows.length) {
    sections.appendChild(el("p", "cb-empty", "No workers are running in this home right now."));
  }
  /* A reload keeps what was already pointed out but not yet sent. */
  Object.keys(pointed).forEach(function (id) {
    if (!data.rows.some(function (r) { return r.id === id; })) delete pointed[id];
  });
  savePointed();
  updateSendBar();

  /* Time in phase ticks in the browser, so the page only reloads when a phase
     or note actually changes. */
  setInterval(function () {
    sinceNodes.forEach(function (s) { s.node.textContent = sinceText(s.row); });
  }, 15000);
})();
</script>
</body>
</html>
